name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  # 손으로 돌릴 수 있게 열어 둔다. 머지했는데 실행이 안 잡히는 일이 실제로 있었고
  # (2026-08-07 Actions 장애 — push 이벤트가 통째로 유실됐다) 그때 다시 굴릴 방법이
  # 없었다. 배포만 다시 태우고 싶을 때도 쓴다.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate i18n
        run: npm run i18n:generate

      # 타입 검사까지 돌린다 — 예전엔 build:skip-check 라 CI 는 통과하고
      # 배포 빌드에서만 터졌다(#191).
      - name: Build Test
        run: npm run build

  trigger-deploy:
    needs: build-test
    # PR 만 빼면 된다. `== 'push'` 로 못 박으면 수동 실행이 빌드만 하고 끝나
    # 정작 필요한 배포를 건너뛴다.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Deploy
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
        run: |
          set -euo pipefail
          # 시크릿에 줄바꿈이나 공백이 딸려 오면 curl 이 URL 을 못 읽는다(exit 3).
          # 값이 마스킹돼 로그로는 안 보이니 여기서 털어 낸다.
          BASE="$(printf '%s' "${JENKINS_URL}" | tr -d '[:space:]')"
          BASE="${BASE%/}"
          case "${BASE}" in
            http://*|https://*) ;;
            "") echo "::error::JENKINS_URL 이 비어 있습니다."; exit 1 ;;
            *) echo "::error::JENKINS_URL 은 http:// 또는 https:// 로 시작해야 합니다."; exit 1 ;;
          esac
          # -f 가 없으면 404·500 에도 curl 이 0 을 돌려준다. 토큰을 틀리게 적어도
          # 초록불이 뜨고 배포는 안 되는 상태가 되므로, HTTP 오류를 실패로 받는다.
          curl -fsS -X POST "${BASE}/generic-webhook-trigger/invoke?token=porest-desk-front-deploy"
